<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoColeta Municipal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f6;
        }

        .container-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 50px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .titulo {
            color: #198754;
            font-weight: bold;
        }

        .eco-pontos {
            background-color: #d1e7dd;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">

        <h1 class="text-center titulo">
            🌱 EcoColeta Municipal
        </h1>

        <p class="text-center">
            Sistema inteligente de solicitação de recolhimento de resíduos especiais.
        </p>

        <div class="eco-pontos">
            ♻️ Ganhe EcoPontos ao descartar corretamente seus resíduos!
        </div>

        <form action="/cadastro" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Nome do cidadão</label>
                <input type="text" name="nome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Endereço</label>
                <input type="text" name="endereco" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Foto do resíduo</label>

                <input
                    type="file"
                    name="foto"
                    class="form-control"
                    accept="image/*"
                    onchange="mostrarImagem(event)"
                    required
                >
            </div>

            <img id="preview">

            <div class="mb-3 mt-3">

                <label class="form-label">
                    Quantidade / Volume do resíduo
                </label>

                <textarea
                    name="descricao"
                    class="form-control"
                    rows="4"
                    placeholder="Exemplo: 3 pneus usados, 20 litros de óleo, 5 sacos de entulho ou aproximadamente 15kg de eletrônicos."
                    required
                ></textarea>

            </div>

            <button type="submit" class="btn btn-success w-100">
                Solicitar Recolhimento
            </button>

        </form>

    </div>

</div>

<script>

function mostrarImagem(event){

    const preview = document.getElementById("preview");

    preview.src = URL.createObjectURL(
        event.target.files[0]
    );

    preview.style.display = "block";
}

</script>

</body>
</html>
